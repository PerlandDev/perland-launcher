packages:
  - ui
  - scripts/release

# Security floors for transitive dependencies (Dependabot can't raise them on
# its own). eslint 10 and typescript-eslint 8 still ask for minimatch ^10, but
# the only fixed release is 11.x, and the API they use is unchanged in 11.
overrides:
  minimatch@<11.0.1: ^11.0.1
