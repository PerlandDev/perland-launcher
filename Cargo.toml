[workspace]
resolver = "2"
members = ["crates/launcher-core", "crates/launcher-app", "crates/perland-cli", "src-tauri"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/PerlandDev/perland-launcher"

[workspace.dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wiremock = "0.6"
toml = "1"
percent-encoding = "2"
getrandom = "0.3"
base64 = "0.22"
fs4 = "1.1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# Hashing every pack file is ~10× slower unoptimized; keep dev runs and tests close to release.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
# Scaling a 4K screenshot down unoptimized takes seconds; keep `tauri dev` close to release.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
