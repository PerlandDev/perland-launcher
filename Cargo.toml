[workspace]
resolver = "2"
members = ["crates/launcher-core", "crates/launcher-app", "crates/perland-cli", "src-tauri"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/PerlandDev/perland-launcher"

[workspace.dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wiremock = "0.6"
toml = "1"
percent-encoding = "2"
fs4 = "1.1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Hashing every pack file is ~10× slower unoptimized; keep dev runs and tests close to release.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
