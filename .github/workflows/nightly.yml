name: Nightly
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The credential store (keyring) builds against D-Bus on Linux.
      - name: Linux D-Bus build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Fabric 1.20.1 + Mojang Java, then launch dry-run
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/perland"
          cargo build -q -p perland-cli
          cargo run -q -p perland-cli -- --root "$ROOT" offline CiBot
          ID=$(cargo run -q -p perland-cli -- --root "$ROOT" create --name "CI Fabric" --mc 1.20.1 --loader fabric --loader-version 0.16.14)
          cargo run -q -p perland-cli -- --root "$ROOT" launch --instance "$ID" --dry-run
      - name: Install Forge 1.20.1-47.4.22 (installer processors), then launch dry-run
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/perland"
          ID=$(cargo run -q -p perland-cli -- --root "$ROOT" create --name "CI Forge" --mc 1.20.1 --loader forge --loader-version 47.4.22)
          cargo run -q -p perland-cli -- --root "$ROOT" launch --instance "$ID" --dry-run
          test -f "$ROOT/libraries/net/minecraftforge/forge/1.20.1-47.4.22/forge-1.20.1-47.4.22-client.jar"
          test -f "$ROOT/versions/1.20.1-forge-47.4.22/1.20.1-forge-47.4.22.jar"
      - name: Sync Asalith Fields (packwiz + Forge 1.20.1), then launch dry-run
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/perland"
          ID=$(cargo run -q -p perland-cli -- --root "$ROOT" pack add https://perlanddev.github.io/asalith-modpack/pack.toml)
          test -n "$ID"
          cargo run -q -p perland-cli -- --root "$ROOT" launch --instance "$ID" --dry-run
          JARS=$(ls "$ROOT/instances/$ID/minecraft/mods/"*.jar | wc -l)
          echo "client jars installed: $JARS"
          test "$JARS" -ge 50
          test -f "$ROOT/instances/$ID/.perland/managed.json"
          test -z "$(cargo run -q -p perland-cli -- --root "$ROOT" pack additions --instance "$ID")"
          cargo run -q -p perland-cli -- --root "$ROOT" sync --instance "$ID" | grep -qx "up to date"
      - name: Second run is offline-capable and skips downloads
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/perland"
          IDS=$(cargo run -q -p perland-cli -- --root "$ROOT" list | cut -f1)
          test -n "$IDS"
          for ID in $IDS; do
            time cargo run -q -p perland-cli -- --root "$ROOT" launch --instance "$ID" --dry-run
          done

  fuzz:
    # Fuzzing never runs on a developer PC (CLAUDE.md). libFuzzer needs nightly Rust on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The repo's rust-toolchain.toml pins stable; cargo-fuzz needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      # The fuzz crate builds launcher-core, whose credential store (keyring) needs D-Bus on Linux.
      - name: D-Bus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each pack, link and server list parser for 3 minutes
        run: |
          # Run every target even if one finds a crash, then fail at the end.
          failed=""
          for target in packwiz_pack packwiz_index packwiz_meta mrpack_index sidecar pack_paths invite_link join_deep_link server_list; do
            cargo fuzz run "$target" -- -max_total_time=180 -rss_limit_mb=2048 -max_len=65536 -timeout=10 || failed="$failed $target"
          done
          # The full log is too long to scroll back through, so name the failures last.
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed"
            find fuzz/artifacts -type f -exec sh -c 'echo "$1: $(base64 -w0 "$1")"' _ {} \; 2>/dev/null
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
