name: Release
# Publishes a launcher release (spec §3.4). Run it from the Actions tab → Release → Run workflow:
# pick the channel and untick "Dry run" to publish. Beta may run from any branch; stable only
# from main. Each publish is public.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [beta, stable]
        default: beta
      dry_run:
        description: Dry run (build only, publish nothing)
        type: boolean
        default: true
      sign_dry_run:
        description: Sign this dry run's Windows installer too (needs your approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Stable comes from main only
        if: inputs.channel == 'stable' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Stable releases are published from main only."
          exit 1
      - name: The updater signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret first."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The updater public key is set
        run: |
          node -e "const k=require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey; if(!k||!k.trim()){console.log('::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json to the updater public key first.');process.exit(1)}"
      # A publish needs CI green on this exact commit; a dry run only warns.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.dry_run && 'dry-run' || 'publish' }}
        run: node scripts/release/cli.mjs ci-check "$GITHUB_SHA" "$MODE"
      # Without it the build has no Microsoft sign-in and nobody could start the game: a publish
      # stops, a dry run only warns.
      - name: The Microsoft client ID is set
        env:
          PERLAND_MS_CLIENT_ID: ${{ vars.PERLAND_MS_CLIENT_ID }}
          MODE: ${{ inputs.dry_run && 'dry-run' || 'publish' }}
        run: node scripts/release/cli.mjs client-id-check "$MODE"
      - id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          v=$(node scripts/release/cli.mjs version "$CHANNEL")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows code signing (docs/superpowers/specs/2026-11-07-windows-code-signing-design.md): with
    # the repository variable CERTUM_SIGNING=true, every publish and any dry run with "Sign this dry
    # run" ticked signs the Windows build with the Certum cloud certificate. That job runs in the `signing` environment, which waits for the owner's
    # approval and is the only place the CERTUM_EMAIL and CERTUM_OTP secrets can be read. The same
    # condition is written twice because `environment` cannot read `env`.
    environment: ${{ (matrix.os == 'windows-latest' && vars.CERTUM_SIGNING == 'true' && (!inputs.dry_run || inputs.sign_dry_run)) && 'signing' || '' }}
    env:
      SIGN_WINDOWS: ${{ matrix.os == 'windows-latest' && vars.CERTUM_SIGNING == 'true' && (!inputs.dry_run || inputs.sign_dry_run) }}
      # ssign (https://github.com/Le-Syl21/ssign, MIT) signs through Certum's cloud API. Pinned by
      # version and by the SHA-256 GitHub recorded for the release asset.
      SSIGN_VERSION: 0.1.11
      SSIGN_SHA256: 3dacba75082d2949bae332f6dfac342843a85838db75deba9721b40b43fe73f0
    steps:
      - uses: actions/checkout@v4
      # Rust builds much faster on a Dev Drive (ReFS) than on C:, so the Windows job builds in a
      # copy of the checkout there. DEV_DRIVE_WORKSPACE stays unset on Linux, which builds in place.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
      - name: Linux webview build dependencies
        if: runner.os == 'Linux'
        # Each apt call is capped and retried (scripts/ci/apt-install.sh); it normally takes under a minute.
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - uses: dtolnay/rust-toolchain@stable
      # Its own key: CI's job is also called build, and sharing its debug cache leaves this job
      # compiling every dependency in release mode on each run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
      - name: Set the release version
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/cli.mjs set-version "$VERSION"
      # Fail before the long build when signing is on but the secrets aren't there.
      - name: The Certum signing secrets are set
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          if [ -z "$CERTUM_EMAIL" ] || [ -z "$CERTUM_OTP" ]; then
            echo "::error::Add the CERTUM_EMAIL and CERTUM_OTP secrets to the signing environment first."
            exit 1
          fi
      - name: Install ssign
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ssign.zip'
          Invoke-WebRequest "https://github.com/Le-Syl21/ssign/releases/download/v$env:SSIGN_VERSION/ssign-windows-x86_64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SSIGN_SHA256) {
            Write-Host "::error::ssign $env:SSIGN_VERSION has SHA-256 $hash, not the pinned $env:SSIGN_SHA256."
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP 'ssign'
          Expand-Archive $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter ssign.exe | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::The ssign archive has no ssign.exe.'; exit 1 }
          & $exe.FullName --version
          "SSIGN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and sign the updater artifacts
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          PERLAND_BUILD: ${{ inputs.channel == 'beta' && 'beta' || '' }}
          PERLAND_PANEL_URL: ${{ vars.PERLAND_PANEL_URL }}
          PERLAND_MS_CLIENT_ID: ${{ vars.PERLAND_MS_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ matrix.bundles }}
          # Empty outside the signing environment. ssign reads them from the environment.
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          args=(--bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":true}}')
          if [ "$SIGN_WINDOWS" = "true" ]; then
            # Tauri signs the launcher, the NSIS plugins, the uninstaller and then the installer, all
            # through `cli.mjs sign`, before it writes the updater .sig over the signed installer.
            export SIGN_DIR="$RUNNER_TEMP/sign"
            node scripts/release/cli.mjs sign-config "$RUNNER_TEMP/sign.json"
            args+=(--config "$RUNNER_TEMP/sign.json")
          fi
          pnpm tauri build "${args[@]}"
      # makensis ignores the uninstaller's sign command failing, so read what every call did.
      - name: Every signing call succeeded
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: SIGN_DIR="$RUNNER_TEMP/sign" node scripts/release/cli.mjs sign-check
      - name: The installer and what it installs are signed
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        timeout-minutes: 10
        run: |
          $installer = @(Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe)
          if ($installer.Count -ne 1) { Write-Host "::error::Expected one installer, found $($installer.Count)."; exit 1 }
          ./scripts/release/verify-authenticode.ps1 -Installer $installer[0].FullName
      - name: Stage the installers
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/cli.mjs stage "$VERSION" target/release/bundle "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      # A publish signs the Windows build whenever signing is on.
      SIGNED: ${{ vars.CERTUM_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true
      - name: Updater manifest
        run: node scripts/release/cli.mjs manifest "$VERSION" dist "https://github.com/$REPO/releases/download/v$VERSION" latest.json
      # The release stays a draft until every installer is up, so players never see it half
      # uploaded. Re-running this job resumes a draft a failed attempt left, and skips a release
      # that is already out.
      - name: Versioned release
        run: |
          tag="v$VERSION"
          title="Perland Launcher $VERSION"
          notes="Closed beta. Download it from https://perland.online/launcher."
          if [ "$SIGNED" != "true" ]; then notes="$notes The installers aren't code-signed yet, so Windows may warn before it runs."; fi
          if state=$(gh release view "$tag" --repo "$REPO" --json isDraft --jq .isDraft 2>&1); then :
          elif grep -q "release not found" <<<"$state"; then state=none
          else echo "$state"; exit 1
          fi
          if [ "$state" = "false" ]; then
            echo "$tag is already published."
            exit 0
          elif [ "$state" = "none" ]; then
            gh release create "$tag" --repo "$REPO" --draft --target "$SHA" --title "$title" --notes "$notes" dist/*
          else
            gh release upload "$tag" --repo "$REPO" --clobber dist/*
          fi
          if [ "$CHANNEL" = "beta" ]; then flags=(--prerelease --latest=false); else flags=(--prerelease=false --latest); fi
          gh release edit "$tag" --repo "$REPO" --draft=false --target "$SHA" --title "$title" --notes "$notes" "${flags[@]}"
      - name: Channel releases
        run: |
          feed() {
            tag="$1"; title="$2"; shift 2
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" --target "$SHA" --title "$title" --latest=false "$@" \
                --notes "The launcher's update feed. Download the launcher from https://perland.online/launcher."
            fi
          }
          node scripts/release/cli.mjs channel-copies "$VERSION" "$CHANNEL" dist channel
          cp latest.json channel/latest.json
          if [ "$CHANNEL" = "beta" ]; then
            feed channel-beta "Beta channel (updates)" --prerelease
            gh release upload channel-beta channel/* --repo "$REPO" --clobber
          else
            feed channel-stable "Stable channel (updates)"
            gh release upload channel-stable channel/* --repo "$REPO" --clobber
            # Beta players move up to a newer stable (spec §3.3); the beta installers stay.
            feed channel-beta "Beta channel (updates)" --prerelease
            gh release upload channel-beta latest.json --repo "$REPO" --clobber
          fi
