name: Release
# Publishes a launcher release (spec §3.4). Run it from the Actions tab → Release → Run workflow:
# pick the channel and untick "Dry run" to publish. Beta may run from any branch; stable only
# from main. Each publish is public.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [beta, stable]
        default: beta
      dry_run:
        description: Dry run (build only, publish nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Stable comes from main only
        if: inputs.channel == 'stable' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Stable releases are published from main only."
          exit 1
      - name: The updater signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret first."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The updater public key is set
        run: |
          node -e "const k=require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey; if(!k||!k.trim()){console.log('::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json to the updater public key first.');process.exit(1)}"
      # A publish needs CI green on this exact commit; a dry run only warns.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.dry_run && 'dry-run' || 'publish' }}
        run: node scripts/release/cli.mjs ci-check "$GITHUB_SHA" "$MODE"
      # Without it the build signs in with the Minecraft Launcher's client; with it, with that
      # Azure app, which Minecraft turns down until Mojang approves it (a warning).
      - name: Which Microsoft app signs in
        env:
          PERLAND_MS_CLIENT_ID: ${{ vars.PERLAND_MS_CLIENT_ID }}
        run: node scripts/release/cli.mjs client-id-check
      - id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          v=$(node scripts/release/cli.mjs version "$CHANNEL")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Rust builds much faster on a Dev Drive (ReFS) than on C:, so the Windows job builds in a
      # copy of the checkout there. DEV_DRIVE_WORKSPACE stays unset on Linux, which builds in place.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
      - name: Linux webview build dependencies
        if: runner.os == 'Linux'
        # Each apt call is capped and retried (scripts/ci/apt-install.sh); it normally takes under a minute.
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - uses: dtolnay/rust-toolchain@stable
      # Its own key: CI's job is also called build, and sharing its debug cache leaves this job
      # compiling every dependency in release mode on each run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
      - name: Set the release version
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/cli.mjs set-version "$VERSION"
      # Authenticode signing stays off until Azure Trusted Signing exists (spec §3.5): set the
      # repository variable AZURE_TRUSTED_SIGNING=true and the AZURE_* secrets to turn it on.
      - name: Install the signing tool
        if: runner.os == 'Windows' && vars.AZURE_TRUSTED_SIGNING == 'true'
        run: cargo install trusted-signing-cli --locked
      # The branded uninstaller (design §6.7) is built first so the NSIS bundle can carry it.
      - name: Build the uninstaller
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          SIGN_WINDOWS: ${{ vars.AZURE_TRUSTED_SIGNING == 'true' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          cargo build -p perland-setup --release --bin perland-uninstall
          if [ "$SIGN_WINDOWS" = "true" ]; then
            trusted-signing-cli -e "$AZURE_SIGNING_ENDPOINT" -a "$AZURE_SIGNING_ACCOUNT" -c "$AZURE_SIGNING_PROFILE" -d PerlandLauncher target/release/perland-uninstall.exe
          fi
      - name: Build and sign the updater artifacts
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          PERLAND_BUILD: ${{ inputs.channel == 'beta' && 'beta' || '' }}
          PERLAND_PANEL_URL: ${{ vars.PERLAND_PANEL_URL }}
          PERLAND_MS_CLIENT_ID: ${{ vars.PERLAND_MS_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ matrix.bundles }}
          SIGN_WINDOWS: ${{ runner.os == 'Windows' && vars.AZURE_TRUSTED_SIGNING == 'true' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          args=(--bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":true}}')
          if [ "$SIGN_WINDOWS" = "true" ]; then
            sign="trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d PerlandLauncher %1"
            args+=(--config "{\"bundle\":{\"windows\":{\"signCommand\":\"$sign\"}}}")
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Release builds only: the bundle carries the branded uninstaller and the hook that
            # points Windows' Uninstall at it. tauri.conf.json stays as it is for local builds.
            args+=(--config '{"bundle":{"resources":{"../target/release/perland-uninstall.exe":"perland-uninstall.exe"},"windows":{"nsis":{"installerHooks":"windows/hooks.nsh"}}}}')
          fi
          pnpm tauri build "${args[@]}"
      # The one-click setup app (docs/superpowers/specs/2026-11-04-branded-setup-design.md) carries
      # the NSIS installer just built, signed when signing is on. latest.json never names it.
      - name: Build the setup app
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          SIGN_WINDOWS: ${{ vars.AZURE_TRUSTED_SIGNING == 'true' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          shopt -s nullglob
          nsis=(target/release/bundle/nsis/*_x64-setup.exe)
          if [ "${#nsis[@]}" -ne 1 ]; then echo "::error::Expected one NSIS installer, found ${#nsis[@]}"; exit 1; fi
          # "About N MB" in the setup's options: what the install puts on disk.
          installed=$(( $(wc -c < target/release/perland-launcher.exe) + $(wc -c < target/release/perland-uninstall.exe) ))
          PERLAND_SETUP_INSTALLED_BYTES="$installed" PERLAND_SETUP_PAYLOAD="$PWD/${nsis[0]}" cargo build -p perland-setup --release --bin perland-setup
          if [ "$SIGN_WINDOWS" = "true" ]; then
            trusted-signing-cli -e "$AZURE_SIGNING_ENDPOINT" -a "$AZURE_SIGNING_ACCOUNT" -c "$AZURE_SIGNING_PROFILE" -d PerlandLauncher target/release/perland-setup.exe
          fi
      - name: Stage the installers
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SETUP: ${{ runner.os == 'Windows' && 'target/release/perland-setup.exe' || '' }}
        run: node scripts/release/cli.mjs stage "$VERSION" target/release/bundle "$GITHUB_WORKSPACE/dist" $SETUP
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true
      - name: Updater manifest
        run: node scripts/release/cli.mjs manifest "$VERSION" dist "https://github.com/$REPO/releases/download/v$VERSION" latest.json
      # The release stays a draft until every installer is up, so players never see it half
      # uploaded. Re-running this job resumes a draft a failed attempt left, and skips a release
      # that is already out.
      - name: Versioned release
        run: |
          tag="v$VERSION"
          title="Perland Launcher $VERSION"
          notes="Closed beta. Download it from https://perland.online/launcher. The installers aren't code-signed yet, so Windows may warn before it runs."
          if state=$(gh release view "$tag" --repo "$REPO" --json isDraft --jq .isDraft 2>&1); then :
          elif grep -q "release not found" <<<"$state"; then state=none
          else echo "$state"; exit 1
          fi
          if [ "$state" = "false" ]; then
            echo "$tag is already published."
            exit 0
          elif [ "$state" = "none" ]; then
            gh release create "$tag" --repo "$REPO" --draft --target "$SHA" --title "$title" --notes "$notes" dist/*
          else
            gh release upload "$tag" --repo "$REPO" --clobber dist/*
          fi
          if [ "$CHANNEL" = "beta" ]; then flags=(--prerelease --latest=false); else flags=(--prerelease=false --latest); fi
          gh release edit "$tag" --repo "$REPO" --draft=false --target "$SHA" --title "$title" --notes "$notes" "${flags[@]}"
      - name: Channel releases
        run: |
          feed() {
            tag="$1"; title="$2"; shift 2
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" --target "$SHA" --title "$title" --latest=false "$@" \
                --notes "The launcher's update feed. Download the launcher from https://perland.online/launcher."
            fi
          }
          node scripts/release/cli.mjs channel-copies "$VERSION" "$CHANNEL" dist channel
          cp latest.json channel/latest.json
          if [ "$CHANNEL" = "beta" ]; then
            feed channel-beta "Beta channel (updates)" --prerelease
            gh release upload channel-beta channel/* --repo "$REPO" --clobber
          else
            feed channel-stable "Stable channel (updates)"
            gh release upload channel-stable channel/* --repo "$REPO" --clobber
            # Beta players move up to a newer stable (spec §3.3); the beta installers stay.
            feed channel-beta "Beta channel (updates)" --prerelease
            gh release upload channel-beta latest.json --repo "$REPO" --clobber
          fi
