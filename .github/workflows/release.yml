name: Release
# Publishes a launcher release (spec §3.4). Run it from the Actions tab → Release → Run workflow:
# pick the channel and untick "Dry run" to publish. Beta may run from any branch; stable only
# from main. Each publish is public.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [beta, stable]
        default: beta
      dry_run:
        description: Dry run (build only, publish nothing)
        type: boolean
        default: true
      release_certificate:
        description: Sign with the release certificate (asks for two approvals in SignPath). Publishes always do.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Stable comes from main only
        if: inputs.channel == 'stable' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Stable releases are published from main only."
          exit 1
      - name: The updater signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret first."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: The updater public key is set
        run: |
          node -e "const k=require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey; if(!k||!k.trim()){console.log('::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json to the updater public key first.');process.exit(1)}"
      - id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          v=$(node scripts/release/cli.mjs version "$CHANNEL")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    # Two SignPath approval waits of up to 60 minutes each, on top of the build.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-15
        with:
          toolchain: stable
      - name: Set the release version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/cli.mjs set-version "$VERSION"
      # Windows Authenticode signing (docs/superpowers/specs/2026-10-15-windows-code-signing-design.md)
      # is off until the repository variable SIGNPATH_SIGNING is true. With it off, every platform
      # builds exactly as before.
      - name: Build and sign the updater artifacts
        if: runner.os != 'Windows' || vars.SIGNPATH_SIGNING != 'true'
        shell: bash
        env:
          PERLAND_BUILD: ${{ inputs.channel == 'beta' && 'beta' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":true}}'
      # Signed Windows build: Tauri's signCommand collects our binaries in pass 1, SignPath signs them
      # (round 1), pass 2 swaps the signed copies in by hash, SignPath signs the installer (round 2),
      # and only then is the updater .sig computed, over the signed bytes. NSIS plugin DLLs are
      # upstream binaries and stay unsigned (SignPath Foundation terms).
      - name: "Signing pass 1: build and collect our binaries"
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        shell: bash
        env:
          PERLAND_BUILD: ${{ inputs.channel == 'beta' && 'beta' || '' }}
        run: |
          export SIGN_DIR="$(cygpath -m "$RUNNER_TEMP/sign")"
          echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SIGN_DIR"
          node scripts/release/cli.mjs sign-config collect "$SIGN_DIR/collect.json"
          pnpm tauri build --bundles nsis --config "$SIGN_DIR/collect.json"
          # makensis ignores the uninstaller sign command's exit code: check the pass from its ledger.
          node scripts/release/cli.mjs sign-check collect
      - name: Upload our binaries for signing
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        id: unsigned-binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-binaries
          path: ${{ env.SIGN_DIR }}/unsigned/*
          if-no-files-found: error
          retention-days: 1
      - name: "Signing round 1: our binaries (approve in SignPath)"
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ (!inputs.dry_run || inputs.release_certificate) && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: launcher-binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ env.SIGN_DIR }}/signed
      - name: "Signing pass 2: bundle with the signed binaries"
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        shell: bash
        env:
          PERLAND_BUILD: ${{ inputs.channel == 'beta' && 'beta' || '' }}
        run: |
          node scripts/release/cli.mjs sign-config apply "$SIGN_DIR/apply.json"
          pnpm tauri bundle --bundles nsis --config "$SIGN_DIR/apply.json"
          node scripts/release/cli.mjs sign-check apply
      - name: Upload the installer for signing
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: "Signing round 2: the installer (approve in SignPath)"
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ (!inputs.dry_run || inputs.release_certificate) && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: launcher-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ env.SIGN_DIR }}/installer
      - name: Updater signature over the signed installer
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          signed=("$SIGN_DIR"/installer/*-setup.exe)
          test "${#signed[@]}" -eq 1
          target="target/release/bundle/nsis/$(basename "${signed[0]}")"
          test -f "$target"
          cp "${signed[0]}" "$target"
          pnpm tauri signer sign --app-version "$VERSION" "$target"
      - name: Check the Authenticode signatures
        if: runner.os == 'Windows' && vars.SIGNPATH_SIGNING == 'true'
        shell: pwsh
        env:
          TRUSTED: ${{ (!inputs.dry_run || inputs.release_certificate) && 'true' || 'false' }}
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName
          if ($env:TRUSTED -eq 'true') { ./scripts/release/verify-authenticode.ps1 -Installer $installer -RequireTrusted }
          else { ./scripts/release/verify-authenticode.ps1 -Installer $installer }
      - name: Stage the installers
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/cli.mjs stage "$VERSION" target/release/bundle dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundles-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      SIGNED: ${{ vars.SIGNPATH_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: bundles-*
          merge-multiple: true
      - name: Updater manifest
        run: node scripts/release/cli.mjs manifest "$VERSION" dist "https://github.com/$REPO/releases/download/v$VERSION" latest.json "$CHANNEL"
      # Idempotent: a draft has no tag, so after a failure both "Re-run failed jobs" and a fresh run
      # compute the same version and reuse the draft. The tag appears only when the draft is published.
      - name: Versioned release
        run: |
          title="Perland Launcher $VERSION"
          notes=$(node scripts/release/cli.mjs notes "$CHANNEL")
          if ! gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$REPO" --draft --target "$SHA" --title "$title" --notes "$notes"
          fi
          gh release upload "v$VERSION" dist/* --repo "$REPO" --clobber
          if [ "$CHANNEL" = "beta" ]; then flags=(--prerelease --latest=false); else flags=(--prerelease=false --latest); fi
          # --target only matters while it is a draft; once the tag exists GitHub ignores it.
          gh release edit "v$VERSION" --repo "$REPO" --target "$SHA" --title "$title" --notes "$notes" --draft=false "${flags[@]}"
      - name: Channel releases
        run: |
          feed() {
            tag="$1"; title="$2"; shift 2
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" --target "$SHA" --title "$title" --latest=false "$@" \
                --notes "The launcher's update feed. Download the launcher from https://perland.online/launcher."
            fi
          }
          node scripts/release/cli.mjs channel-copies "$VERSION" "$CHANNEL" dist channel
          cp latest.json channel/latest.json
          if [ "$CHANNEL" = "beta" ]; then
            feed channel-beta "Beta channel (updates)" --prerelease
            gh release upload channel-beta channel/* --repo "$REPO" --clobber
          else
            feed channel-stable "Stable channel (updates)"
            gh release upload channel-stable channel/* --repo "$REPO" --clobber
            # Beta players move up to a newer stable (spec §3.3); the beta installers stay.
            feed channel-beta "Beta channel (updates)" --prerelease
            gh release upload channel-beta latest.json --repo "$REPO" --clobber
          fi
