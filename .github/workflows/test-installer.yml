# Builds an unsigned Windows installer from this branch for hand testing, and uploads it as a
# workflow artifact. Nothing is published: no release, no updater manifest. Temporary: remove
# before merging.
name: Test installer
on:
  push:
    branches: [claude/forget-invited-server]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Above the published v0.2.0-beta.26, so the beta updater leaves it alone until a newer beta.
      VERSION: 0.2.0-beta.26.test.1
    steps:
      - uses: actions/checkout@v4
      - name: Dev Drive
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
      - name: Set the test version
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: node scripts/release/cli.mjs set-version "$VERSION"
      - name: Build the installer
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          PERLAND_BUILD: beta
          PERLAND_PANEL_URL: ${{ vars.PERLAND_PANEL_URL }}
          PERLAND_MS_CLIENT_ID: ${{ vars.PERLAND_MS_CLIENT_ID }}
        run: pnpm tauri build --bundles nsis
      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$DEV_DRIVE_WORKSPACE"/target/release/bundle/nsis/*.exe "$GITHUB_WORKSPACE/out/"
          ls -l "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: perland-launcher-test-windows
          path: out/*.exe
          if-no-files-found: error
          retention-days: 7
