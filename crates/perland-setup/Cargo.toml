[package]
name = "perland-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Perland Launcher's one-click Windows setup"

[dependencies]
semver = { workspace = true }
getrandom = { workspace = true }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
accesskit = "0.25"
rfd = { version = "0.15", default-features = false }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_DataExchange",
  "Win32_System_Environment",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
